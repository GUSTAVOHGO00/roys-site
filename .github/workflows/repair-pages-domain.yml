name: Repair Pages custom domain

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/repair-pages-domain.yml"

permissions:
  contents: read
  pages: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current Pages state
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/pages"

      - name: Reset and restore custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          restore_domain() {
            printf '%s' '{"cname":"www.roys.com.br","build_type":"workflow"}' |
              gh api \
                --method PUT \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "repos/${GITHUB_REPOSITORY}/pages" \
                --input -
          }

          trap restore_domain EXIT

          printf '%s' '{"cname":null,"build_type":"workflow"}' |
            gh api \
              --method PUT \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/pages" \
              --input -

          sleep 20
          restore_domain
          trap - EXIT

      - name: Wait for certificate and enforce HTTPS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..30}; do
            config="$(gh api "repos/${GITHUB_REPOSITORY}/pages")"
            state="$(printf '%s' "$config" | jq -r '.https_certificate.state // "pending"')"

            echo "Certificate state: ${state} (attempt ${attempt}/30)"

            if [ "$state" = "approved" ]; then
              printf '%s' '{"https_enforced":true}' |
                gh api \
                  --method PUT \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  "repos/${GITHUB_REPOSITORY}/pages" \
                  --input -
              exit 0
            fi

            sleep 30
          done

          echo "::warning::The custom domain was restored, but GitHub is still issuing the certificate."

      - name: Inspect final Pages state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/pages"
